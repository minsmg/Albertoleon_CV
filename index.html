<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Currículum Digital - Alberto León</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #2c3e50;
    }
    header {
      background-color: #34495e;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {
      background-color: #2c3e50;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      color: #1abc9c;
    }
    h2 {
      color: #2c3e50;
      margin: 20px 0 10px;
      text-align: center;
    }
    .certificados {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .btn-certificado {
      display: inline-block;
      padding: 10px 15px;
      background-color: #3498db;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    .btn-certificado:hover {
      background-color: #1d6fa5;
    }
    footer {
      background-color: #34495e;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
    footer a {
      color: #1abc9c;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Currículum Digital - Alberto León</h1>
  </header>

  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#experiencia">Experiencia</a>
    <a href="#educacion">Educación</a>
    <a href="#certificaciones">Certificaciones</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="certificaciones">
    <h2>Certificaciones</h2>
    <div class="certificados">
      <a href="https://minsmg.github.io/Albertoleon_CV/certificados/ready_learning.pdf" target="_blank" class="btn-certificado">Ready Learning</a>
      <a href="https://minsmg.github.io/Albertoleon_CV/certificados/soitsha.pdf" target="_blank" class="btn-certificado">Soitsha</a>
      <a href="https://minsmg.github.io/Albertoleon_CV/certificados/hidrodesulfuracion.pdf" target="_blank" class="btn-certificado">Hidrodesulfuración</a>
      <a href="https://minsmg.github.io/Albertoleon_CV/certificados/certificado_ingles_intermedio.pdf" target="_blank" class="btn-certificado">Inglés Intermedio</a>
      <a href="https://minsmg.github.io/Albertoleon_CV/certificados/diplomado_liderazgo.pdf" target="_blank" class="btn-certificado">Diplomado en Liderazgo</a>
    </div>
  </section>

  <footer id="contacto">
    <p>Contacto: 
      <a href="mailto:alberto.leon@example.com">alberto.leon@example.com</a> | 
      <a href="https://www.linkedin.com/in/alberto-leon" target="_blank">LinkedIn</a> | 
      <a href="https://github.com/minsmg" target="_blank">GitHub</a>
    </p>
    <p>&copy; 2026 Alberto León - Todos los derechos reservados</p>
  </footer>

</body>
</html>
