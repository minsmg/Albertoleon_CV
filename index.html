<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Digital - Alberto Enrique León Soto</title>

  <style>
    /* Estilo general */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #eef1f5;
      color: #333;
      line-height: 1.6;
    }

    /* Encabezado */
    header {
      background: linear-gradient(135deg, #1f3c88, #3a6ea5);
      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
    }

    header p {
      margin-top: 10px;
      font-size: 1.2rem;
      opacity: 0.9;
    }

    /* Secciones */
    section {
      background: white;
      margin: 20px auto;
      padding: 25px;
      width: 90%;
      max-width: 800px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
    }

    section:hover {
      transform: translateY(-3px);
    }

    /* Títulos */
    h2 {
      color: #1f3c88;
      margin-bottom: 15px;
      border-left: 5px solid #3a6ea5;
      padding-left: 10px;
    }

    /* Listas */
    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    li:last-child {
      border-bottom: none;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #555;
      margin-top: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<header>
  <h1>Alberto Enrique León Soto</h1>
  <p>CV Digital</p>
</header>

<section id="experiencia">
  <h2>Experiencia</h2>
  <ul>
    <li>Descripción de tu experiencia profesional…</li>
  </ul>
</section>

<section id="educacion">
  <h2>Educación</h2>
  <ul>
    <li>Tu formación académica…</li>
  </ul>
</section>

<section id="contacto">
  <h2>Contacto</h2>
  <ul>
    <li>Email: tu_correo@example.com</li>
    <li>Teléfono: +57 000 000 0000</li>
    <li>LinkedIn: tu enlace</li>
  </ul>
</section>

<footer>
  © 2026 Alberto Enrique León Soto
</footer>

</body>
</html>
